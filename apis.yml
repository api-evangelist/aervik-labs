apis:
- name: Aervik Labs API
  description: >-
    ACORD 25 Data Extraction & COI Verification. Extract a certificate of
    insurance into structured fields and verify it against saved coverage
    requirements, with a three-state verdict (compliant / deficient /
    cannot_determine) that flags fields which are present but unreadable rather
    than guessing. Four operations behind the RapidAPI gateway.
